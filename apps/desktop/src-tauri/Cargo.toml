[package]
name = "mochi-desktop"
version = "0.2.0"
description = "Mochi —— 会成长的桌面智能伙伴（Tauri 桌面壳）"
authors = ["Mochi Contributors"]
edition = "2021"

# 库目标供 Tauri 移动端/测试入口复用；桌面主入口为 main.rs
[lib]
name = "mochi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png：TrayIcon 图标经 Image.fromBytes 解码 PNG 必需（缺失时
# plugin:image|from_bytes 命令不响应，invoke 永久挂起——M1-S0 托盘根因）
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# 窗口位置记忆（功能清单 1.3）：官方插件自动处理多显示器/分辨率边界
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 发布包体积优化（规范：见 docs/specs/monorepo-structure.md §6）
codegen-units = 1
lto = true
opt-level = "s"
strip = true
