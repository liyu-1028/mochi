[project]
name = "mochi-server"
version = "0.1.0"
description = "Mochi Agent sidecar —— LangGraph 驱动的本地认知核心"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings[toml]>=2.4",
    # M0-S2 模型接入层（选型理由见 docs/internal/adr/0002-model-integration.md）
    "openai>=1.55,<2.0",     # AsyncOpenAI + base_url 覆盖，兼容 OpenAI 系与 Ollama /v1
    "anthropic>=0.40",       # M1-S0 补齐（ADR-0002 D1）：独立适配，不与 OpenAI 系统一
    "keyring>=25.0",         # API Key 存 OS 钥匙串（key_ref 规则，config-format.md §3）
    "platformdirs>=4.2",     # 数据目录解析，与 Tauri app_data_dir 对齐
    "tomli-w>=1.0",          # TOML 写入（标准库 tomllib 只读）
    # M1-S1 会话持久化（4.3/6.2）：异步 SQLite，轻量迁移不用 Alembic
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",  # FastAPI UploadFile（M1-S1 皮肤导入）
]

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "pillow>=10.4",  # 仅 dev：内置静态皮肤抠图脚本（scripts/make_static_skins.py）
    "pyinstaller>=6.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mochi_server"]

# ---------------------------------------------------------------------------
# Ruff —— lint + format 二合一（规范见 docs/specs/code-style.md）
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort（导入排序）
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff 专有规则
]
ignore = [
    "E501",   # 行长度交给 formatter
    "RUF001", # 中文项目的注释/文档字符串天然含全角标点，豁免 ambiguous-unicode 系列
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["mochi_server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
