[project]
name = "mochi-server"
version = "0.1.0"
description = "Mochi Agent sidecar —— LangGraph 驱动的本地认知核心"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # 骨架阶段最小依赖；LangGraph 在 M0 引入（见 docs/specs/monorepo-structure.md §5）
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings[toml]>=2.4",
]

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mochi_server"]

# ---------------------------------------------------------------------------
# Ruff —— lint + format 二合一（规范见 docs/specs/code-style.md）
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort（导入排序）
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff 专有规则
]
ignore = [
    "E501",   # 行长度交给 formatter
    "RUF001", # 中文项目的注释/文档字符串天然含全角标点，豁免 ambiguous-unicode 系列
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["mochi_server"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
