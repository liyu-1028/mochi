# Mochi 用户配置示例（规范：docs/specs/config-format.md）
# 实际文件位于用户数据目录：<userData>/config.toml
# 注意：API Key 等敏感信息【永不】写入本文件，仅存 key_ref 指向系统钥匙串。

config_version = 2

[general]
language = "zh-CN"           # zh-CN | en
launch_at_startup = false    # 开机自启（功能清单 1.6，默认关闭）
telemetry = false            # 遥测默认关闭（功能清单 7.7）
power_save = false           # 省电模式（2.6）：角色钉 15fps + 暂停漂浮动画

[character]
active_skin = "default"      # 当前皮肤包 id

[model]
default_profile = "ollama-qwen"  # 必须是 [model.profiles.*] 中已定义的 id，或 trial

[model.connections.ollama]
preset_id = "ollama"         # dashscope | zhipu | openai | anthropic | ollama | custom
display_name = "Ollama (本地)"

[model.connections.ollama.endpoints]
openai_chat = "http://127.0.0.1:11434"

[model.profiles.ollama-qwen]
connection_id = "ollama"
display_name = "本地 Qwen"
protocol = "openai_chat"     # openai_chat | openai_responses | anthropic_messages
model = "qwen3:8b"

[model.connections.my_cloud]
preset_id = "custom"
display_name = "我的云端账号"
key_ref = "mochi:provider:my_cloud"   # 系统钥匙串条目名，非明文 Key

[model.connections.my_cloud.endpoints]
openai_chat = "https://api.example.com/v1"

[model.profiles.my_cloud_chat]
connection_id = "my_cloud"
display_name = "我的云端模型"
protocol = "openai_chat"
model = "example-chat"
# context_window = 32768            # 可选：token 窗口（4.4 预算裁剪），缺省 8192

[voice]
tts_enabled = true
engine = "edge"              # edge（默认免费）| local（Piper 等，M1）
voice_id = "zh-CN-XiaoxiaoNeural"
volume = 1.0                 # 0.0 ~ 1.0
rate = 1.0                   # 语速倍率
muted = false

[privacy]
local_only = false           # 隐私模式（功能清单 7.3）：true 时阻断一切云端请求

[skills]
enabled = []                 # 已启用技能 id 列表（如 "web_search"）

[tools]
allowed = []                # dangerous 工具「总是允许」白名单（6.5 确认框勾选后自动追加）

[agent]
emotion = "auto"                # 回复后情绪推断（2.5）：auto 开启 / off 恒 neutral

[memory]
auto_extract = true           # 对话后自动沉淀记忆（6.4）：false 则仅手动添加；每日上限 20 条
