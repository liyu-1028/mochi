# 发布流水线：tag（v*）触发，双平台三架构原生构建安装包，
# 构建完成后自动发布 GitHub Release 并上传安装包。
#
# 矩阵均为原生架构构建（无交叉编译）：
#   macos-15       → Apple Silicon（aarch64-apple-darwin）dmg
#   macos-15-intel → Intel（x86_64-apple-darwin）dmg（macos-13 已于 2025-12 退役）
#   windows-latest → x86_64-pc-windows-msvc，nsis 安装包
#
# sidecar 由 beforeBuildCommand 链中的 scripts/package-sidecar.sh 用
# PyInstaller 现机构建（PyInstaller 不支持交叉编译，必须与目标机同架构）。
#
# TODO：macOS Developer ID 签名 + 公证、Windows 代码签名、1.7 增量更新。
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            bundles: dmg
          - platform: macos-15-intel
            bundles: dmg
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # 先校验再构建：tag 必须与 tauri.conf.json 版本一致，避免 20 分钟构建后
      # 发现产物版本与 tag 对不上（打 tag 前请先升版本号）
      - name: 校验 tag 与 tauri.conf.json 版本一致
        shell: bash # Windows 矩阵走 Git Bash
        run: |
          CONF_VERSION="$(grep -o '"version": *"[^"]*"' apps/desktop/src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CONF_VERSION" != "$TAG_VERSION" ]; then
            echo "✗ tag ${GITHUB_REF_NAME} 与 tauri.conf.json 版本 ${CONF_VERSION} 不一致" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: 前端依赖
        run: pnpm install --frozen-lockfile

      - name: Python 工具链（uv 托管，供 PyInstaller 使用）
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.1" # uv 版本固定，与生成 uv.lock 的版本一致
      - run: uv python install 3.12 # 与 server/.python-version 一致

      # 版本与根目录 rust-toolchain.toml 一致（升级时两处同改）
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      # beforeBuildCommand 会依次执行：Live2D Core 下载 → sidecar PyInstaller
      # 打包 → tsc → vite build，随后 cargo release + 打 ${{ matrix.bundles }}
      - name: 构建安装包
        run: pnpm --filter @mochi/desktop exec tauri build --bundles ${{ matrix.bundles }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mochi-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: build
    # 显式 if 覆盖 needs 的默认 success() 门禁：容忍个别平台腿失败
    # （如 runner 镜像退役）仍发布已有产物；仅取消时不发布。
    # 全部失败（无产物）会被下方「校验产物」拦下，不会发出空 Release。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # softprops/action-gh-release 创建 Release 所需
    steps:
      - name: 下载各平台安装包
        uses: actions/download-artifact@v4
        with:
          pattern: mochi-*-${{ github.ref_name }}
          path: dist
          merge-multiple: true

      # upload-artifact 会保留 bundle/dmg、bundle/nsis 目录结构，递归查找
      - name: 校验产物（至少一个安装包）
        run: |
          find dist -type f | sort
          COUNT="$(find dist -type f \( -name '*.dmg' -o -name '*.exe' \) | wc -l | tr -d ' ')"
          echo "待发布安装包：${COUNT} 个"
          [ "$COUNT" -gt 0 ] || { echo "✗ 无任何安装包产物，取消发布" >&2; exit 1; }

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
