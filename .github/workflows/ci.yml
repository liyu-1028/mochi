# M0-S1 最小 CI：lint + typecheck + 双端测试 + Rust clippy
# 发布流水线（双平台构建/签名/自动更新）为 M1 专项，见 docs/specs/monorepo-structure.md §7
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端（ESLint / typecheck / vitest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm typecheck
      - run: pnpm --filter @mochi/protocol test
      - run: pnpm --filter @mochi/desktop test

  server:
    name: 后端（Ruff / pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: uv sync
        working-directory: server
        run: uv sync --frozen
      - name: ruff check
        working-directory: server
        run: uv run ruff check .
      - name: pytest
        working-directory: server
        run: uv run pytest -q

  rust:
    name: 桌面壳（cargo clippy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # TODO：本机安装 Rust 后将 Cargo.lock 入库，此处改为 --locked
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy -- -D warnings
